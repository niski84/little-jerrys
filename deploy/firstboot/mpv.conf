# System-wide mpv config baked into the Pi appliance image. mpv reads
# this on every spawn (including the one started by jerry.service). It
# pushes mpv into a sane appliance configuration:
#
#   - vo=gpu with gpu-context=drm renders directly to /dev/dri/card0,
#     bypassing X entirely. Pi OS Lite has no desktop session, so this
#     is what gets pixels onto HDMI-0.
#   - Pi 4/5 have a v4l2 hardware decoder we want lit up.
#   - audio=alsa keeps it simple — no PulseAudio dragged in.

# --- Video output ---
vo=gpu
gpu-context=drm
gpu-api=opengl

# --- Hardware decode ---
hwdec=auto-safe

# --- Audio ---
ao=alsa

# --- Behavior ---
fullscreen=yes
osd-level=0
keep-open=no
image-display-duration=8

# --- Quiet ---
quiet=yes
no-terminal=yes
