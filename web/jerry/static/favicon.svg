<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Yellow oval — Little Jerry's brand color -->
  <ellipse cx="16" cy="16" rx="15.5" ry="12" fill="#FFD700" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Bold red script "J" in the center, evokes the Jerry's logo wordmark -->
  <text x="16" y="25"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24"
        font-weight="900"
        font-style="italic"
        fill="#C8102E"
        text-anchor="middle"
        stroke="#1a1a1a"
        stroke-width="0.5"
        paint-order="stroke fill">J</text>
</svg>
